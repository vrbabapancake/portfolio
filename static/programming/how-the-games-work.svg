<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1120" width="1200" height="1120" role="img" aria-labelledby="t d">
  <title id="t">How the games work</title>
  <desc id="d">The host opens the big screen and gets a room code; teams join on their phones. In 6Clues, movie clues appear one at a time and early guesses score more. In Pub Trivia, the host builds a quiz from the round bank, teams answer a round on their phone, and answers are revealed with ticks and crosses.</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Bitter:wght@400;600&amp;family=Figtree:wght@600;700;800&amp;display=swap');
      .d { font-family: 'Figtree', ui-sans-serif, system-ui, -apple-system, Arial, sans-serif; }
      .b { font-family: 'Bitter', Georgia, serif; }
      .ink { fill: #26132a; }
      .muted { fill: #55455a; }
      .teal { fill: #2f5d6e; }
      .cream { fill: #f6f1ea; }
      .line { fill: none; stroke: #26132a; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
      .card { fill: #ffffff; stroke: #26132a; stroke-width: 2; }
      .lilac { fill: #f3cdf7; }
      .soft { fill: #f8e4fa; stroke: #26132a; stroke-width: 2; }
      .grid { fill: url(#grid); }
      .btn { fill: #2c5566; stroke: #26132a; stroke-width: 2; }
      .hidden { fill: #ffffff; stroke: #7d6f80; stroke-width: 1.5; stroke-dasharray: 4 4; }
    </style>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#26132a" stroke-opacity=".12"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#26132a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <!-- three window dots -->
    <g id="dots"><circle cx="0" cy="0" r="4" class="ink"/><circle cx="13" cy="0" r="4" class="ink"/><circle cx="26" cy="0" r="4" class="ink"/></g>
  </defs>

  <!-- page -->
  <rect width="1200" height="1120" fill="#f6f1ea"/>

  <!-- ===== header band ===== -->
  <rect width="1200" height="150" fill="#36677a"/>
  <path d="M0 150H1200" class="line"/>
  <text x="60" y="84" class="d cream" font-size="50" font-weight="800" letter-spacing="-1.5">How the games work</text>
  <text x="62" y="120" class="b cream" font-size="20">One big screen, a phone per team, one four-letter room code.</text>
  <rect x="1000" y="28" width="140" height="96" rx="24" class="lilac"/>
  <g transform="translate(1030 46) rotate(-6)">
    <rect width="96" height="66" rx="8" class="card"/>
    <text x="48" y="48" text-anchor="middle" class="d ink" font-size="40" font-weight="800">?</text>
  </g>

  <!-- ===== shared setup strip ===== -->
  <rect x="48" y="188" width="1112" height="250" rx="10" class="lilac"/>
  <rect x="40" y="180" width="1112" height="250" rx="10" class="card"/>

  <!-- step 1: big screen -->
  <circle cx="84" cy="220" r="17" class="btn"/>
  <text x="84" y="226" text-anchor="middle" class="d" fill="#fff" font-size="17" font-weight="800">1</text>
  <text x="110" y="227" class="d ink" font-size="20" font-weight="800">Host opens the big screen</text>
  <rect x="80" y="252" width="360" height="152" rx="6" class="card"/>
  <rect x="81" y="277" width="358" height="126" class="grid"/>
  <path d="M80 277H440" class="line"/>
  <use href="#dots" x="394" y="265"/>
  <text x="260" y="308" text-anchor="middle" class="b muted" font-size="15">Room code</text>
  <text x="260" y="358" text-anchor="middle" class="d ink" font-size="50" font-weight="800" letter-spacing="8">GNPX</text>
  <text x="260" y="388" text-anchor="middle" class="b muted" font-size="13">Join on your phone</text>

  <path d="M458 328H540" class="line" stroke-dasharray="6 6" marker-end="url(#arrow)"/>

  <!-- step 2: phones -->
  <circle cx="568" cy="220" r="17" class="btn"/>
  <text x="568" y="226" text-anchor="middle" class="d" fill="#fff" font-size="17" font-weight="800">2</text>
  <text x="594" y="227" class="d ink" font-size="20" font-weight="800">Teams join on their phones</text>
  <defs>
    <g id="phone-join">
      <rect x="0" y="0" width="78" height="138" rx="14" class="card"/>
      <path d="M30 12H48" class="line"/>
    </g>
  </defs>
  <g font-size="12">
    <use href="#phone-join" x="560" y="262"/>
    <text x="599" y="300" text-anchor="middle" class="d ink" font-weight="700">Owls</text>
    <rect x="570" y="310" width="58" height="24" rx="5" class="card" stroke-width="1.5"/>
    <text x="599" y="327" text-anchor="middle" class="d ink" font-weight="700" letter-spacing="2">GNPX</text>
    <rect x="570" y="344" width="58" height="24" rx="5" class="btn"/>
    <text x="599" y="361" text-anchor="middle" class="d" fill="#fff" font-weight="700">Join</text>

    <use href="#phone-join" x="652" y="262"/>
    <text x="691" y="300" text-anchor="middle" class="d ink" font-weight="700">Reds</text>
    <rect x="662" y="310" width="58" height="24" rx="5" class="card" stroke-width="1.5"/>
    <text x="691" y="327" text-anchor="middle" class="d ink" font-weight="700" letter-spacing="2">GNPX</text>
    <rect x="662" y="344" width="58" height="24" rx="5" class="btn"/>
    <text x="691" y="361" text-anchor="middle" class="d" fill="#fff" font-weight="700">Join</text>

    <use href="#phone-join" x="744" y="262"/>
    <text x="783" y="300" text-anchor="middle" class="d ink" font-weight="700">Bill</text>
    <rect x="754" y="310" width="58" height="24" rx="5" class="card" stroke-width="1.5"/>
    <text x="783" y="327" text-anchor="middle" class="d ink" font-weight="700" letter-spacing="2">GNPX</text>
    <rect x="754" y="344" width="58" height="24" rx="5" class="lilac" stroke="#26132a" stroke-width="2"/>
    <text x="783" y="361" text-anchor="middle" class="d ink" font-weight="700">Joined ✓</text>
  </g>

  <!-- step 3: pick a game -->
  <circle cx="882" cy="220" r="17" class="btn"/>
  <text x="882" y="226" text-anchor="middle" class="d" fill="#fff" font-size="17" font-weight="800">3</text>
  <text x="908" y="227" class="d ink" font-size="20" font-weight="800">Play</text>
  <text x="866" y="278" class="b ink" font-size="16">The same setup for both games.</text>
  <text x="866" y="304" class="b ink" font-size="16">Each team plays on one phone.</text>
  <text x="866" y="330" class="b ink" font-size="16">Scores show on the big screen.</text>
  <rect x="866" y="356" width="104" height="38" rx="8" class="lilac" stroke="#26132a" stroke-width="2"/>
  <text x="918" y="381" text-anchor="middle" class="d ink" font-size="16" font-weight="800">6Clues</text>
  <rect x="982" y="356" width="136" height="38" rx="8" class="lilac" stroke="#26132a" stroke-width="2"/>
  <text x="1050" y="381" text-anchor="middle" class="d ink" font-size="16" font-weight="800">Pub Trivia</text>

  <!-- ===== 6Clues column ===== -->
  <rect x="48" y="478" width="548" height="570" rx="10" class="lilac"/>
  <rect x="40" y="470" width="548" height="570" rx="10" class="card"/>
  <path d="M41 534H587V480a9 9 0 0 0-9-9H50a9 9 0 0 0-9 9Z" fill="#f8e4fa"/>
  <path d="M40 534H588" class="line"/>
  <text x="68" y="514" class="d ink" font-size="28" font-weight="800" letter-spacing="-.4">6Clues</text>
  <text x="172" y="513" class="b muted" font-size="17">Movie trivia</text>

  <!-- big screen with clues -->
  <rect x="68" y="558" width="300" height="230" rx="6" class="card"/>
  <rect x="69" y="583" width="298" height="204" class="grid"/>
  <path d="M68 583H368" class="line"/>
  <use href="#dots" x="322" y="571"/>
  <text x="84" y="608" class="d teal" font-size="14" font-weight="800">Clue 2 of 6</text>
  <rect x="294" y="594" width="58" height="22" rx="11" class="btn" stroke-width="1.5"/>
  <text x="323" y="610" text-anchor="middle" class="d" fill="#fff" font-size="12" font-weight="800">5 pts</text>
  <rect x="84" y="622" width="268" height="36" rx="6" class="card" stroke-width="1.5"/>
  <text x="96" y="645" class="b ink" font-size="14">1. 1975 thriller</text>
  <rect x="84" y="664" width="268" height="36" rx="6" class="card" stroke-width="1.5"/>
  <rect x="84" y="664" width="5" height="36" fill="#36677a"/>
  <text x="98" y="687" class="b ink" font-size="14">2. A small island beach town</text>
  <rect x="84" y="708" width="268" height="14" rx="4" class="hidden"/>
  <rect x="84" y="727" width="268" height="14" rx="4" class="hidden"/>
  <rect x="84" y="746" width="268" height="14" rx="4" class="hidden"/>
  <rect x="84" y="765" width="268" height="14" rx="4" class="hidden"/>

  <path d="M372 690H396" class="line" marker-end="url(#arrow)"/>

  <!-- phone guessing -->
  <rect x="404" y="588" width="128" height="200" rx="16" class="card"/>
  <path d="M456 600H480" class="line"/>
  <text x="468" y="628" text-anchor="middle" class="d ink" font-size="12" font-weight="800">Clue 2 · 5 pts</text>
  <rect x="416" y="640" width="104" height="30" rx="6" class="card" stroke="#7d6f80" stroke-width="1.5"/>
  <text x="426" y="660" class="b ink" font-size="14">Jaws</text>
  <rect x="416" y="678" width="104" height="30" rx="6" class="btn"/>
  <text x="468" y="698" text-anchor="middle" class="d" fill="#fff" font-size="13" font-weight="800">Lock in</text>
  <path d="M416 722H520" stroke="#26132a" stroke-opacity=".16" stroke-width="1.5"/>
  <text x="468" y="742" text-anchor="middle" class="b muted" font-size="11">Your score</text>
  <text x="468" y="772" text-anchor="middle" class="d ink" font-size="26" font-weight="800">6</text>

  <!-- points ladder -->
  <text x="68" y="826" class="d ink" font-size="17" font-weight="800">Guess early, score big</text>
  <g class="d" font-weight="800" font-size="14" text-anchor="middle">
    <rect x="68"  y="844" width="72" height="44" rx="4" fill="#36677a" stroke="#26132a" stroke-width="2"/>
    <text x="104" y="872" fill="#fff">6</text>
    <rect x="156" y="850" width="72" height="38" rx="4" class="lilac" stroke="#26132a" stroke-width="2"/>
    <text x="192" y="875" class="ink">5</text>
    <rect x="244" y="856" width="72" height="32" rx="4" class="lilac" stroke="#26132a" stroke-width="2"/>
    <text x="280" y="878" class="ink">4</text>
    <rect x="332" y="862" width="72" height="26" rx="4" class="lilac" stroke="#26132a" stroke-width="2"/>
    <text x="368" y="881" class="ink">3</text>
    <rect x="420" y="868" width="72" height="20" rx="4" class="lilac" stroke="#26132a" stroke-width="2"/>
    <text x="456" y="884" class="ink" font-size="12">2</text>
    <rect x="508" y="874" width="56" height="14" rx="4" class="lilac" stroke="#26132a" stroke-width="2"/>
    <text x="536" y="886" class="ink" font-size="10">1</text>
  </g>
  <g class="b muted" font-size="12" text-anchor="middle">
    <text x="104" y="906">clue 1</text><text x="192" y="906">clue 2</text><text x="280" y="906">clue 3</text>
    <text x="368" y="906">clue 4</text><text x="456" y="906">clue 5</text><text x="536" y="906">clue 6</text>
  </g>

  <g class="b ink" font-size="15">
    <text x="68" y="942">• Clues appear one at a time, hardest first.</text>
    <text x="68" y="968">• Every team locks in a guess on their phone.</text>
    <text x="68" y="994">• Anyone right? They score, then it’s the next movie.</text>
    <text x="68" y="1020">• Nobody right? Here comes the next clue.</text>
  </g>

  <!-- ===== Pub Quizzes column ===== -->
  <rect x="620" y="478" width="540" height="570" rx="10" class="lilac"/>
  <rect x="612" y="470" width="540" height="570" rx="10" class="card"/>
  <path d="M613 534H1151V480a9 9 0 0 0-9-9H622a9 9 0 0 0-9 9Z" fill="#f8e4fa"/>
  <path d="M612 534H1152" class="line"/>
  <text x="640" y="514" class="d ink" font-size="28" font-weight="800" letter-spacing="-.4">Pub Trivia</text>
  <text x="788" y="513" class="b muted" font-size="17">Pub quiz</text>

  <!-- round bank -->
  <text x="640" y="566" class="d ink" font-size="13" font-weight="800">Round bank</text>
  <rect x="652" y="586" width="152" height="84" rx="6" class="card"/>
  <rect x="646" y="580" width="152" height="84" rx="6" class="card"/>
  <rect x="640" y="574" width="152" height="84" rx="6" class="soft"/>
  <text x="654" y="600" class="d ink" font-size="13" font-weight="800">Mystery connection</text>
  <text x="654" y="623" class="b muted" font-size="12">Connections · 10 Qs</text>
  <text x="654" y="644" class="b muted" font-size="12">+ 283 more</text>

  <!-- phone answering -->
  <rect x="652" y="688" width="128" height="196" rx="16" class="card"/>
  <path d="M704 700H728" class="line"/>
  <text x="716" y="724" text-anchor="middle" class="d ink" font-size="12" font-weight="800">Round 2 · Owls</text>
  <g class="b ink" font-size="11">
    <rect x="664" y="734" width="104" height="22" rx="5" class="card" stroke="#7d6f80" stroke-width="1.5"/>
    <text x="671" y="749">1. Ruth Gordon</text>
    <rect x="664" y="760" width="104" height="22" rx="5" class="card" stroke="#7d6f80" stroke-width="1.5"/>
    <text x="671" y="775">2. Shatner</text>
    <rect x="664" y="786" width="104" height="22" rx="5" class="card" stroke="#7d6f80" stroke-width="1.5"/>
    <text x="671" y="801">3. Johnny Cash</text>
    <rect x="664" y="812" width="104" height="22" rx="5" class="card" stroke="#7d6f80" stroke-width="1.5"/>
    <text x="671" y="827">4. Nimoy</text>
  </g>
  <rect x="664" y="842" width="104" height="28" rx="6" class="btn"/>
  <text x="716" y="861" text-anchor="middle" class="d" fill="#fff" font-size="13" font-weight="800">Send answers</text>

  <path d="M808 616H820" class="line" marker-end="url(#arrow)"/>
  <path d="M786 780H818" class="line" marker-end="url(#arrow)"/>

  <!-- big screen reveal -->
  <rect x="826" y="558" width="306" height="248" rx="6" class="card"/>
  <rect x="827" y="583" width="304" height="222" class="grid"/>
  <path d="M826 583H1132" class="line"/>
  <use href="#dots" x="1086" y="571"/>
  <text x="842" y="608" class="d teal" font-size="14" font-weight="800">Round 2 · Mystery connection</text>
  <text x="842" y="630" class="b muted" font-size="13">Answer 4</text>
  <text x="842" y="664" class="d ink" font-size="28" font-weight="800" letter-spacing="-.4">Leonard Nimoy</text>
  <g class="d" font-size="15" font-weight="700">
    <rect x="842" y="680" width="274" height="32" rx="6" class="card" stroke-width="1.5"/>
    <text x="856" y="701" class="ink">Owls</text>
    <text x="1104" y="701" text-anchor="end" fill="#1d6b3a">✓ +1</text>
    <rect x="842" y="718" width="274" height="32" rx="6" class="card" stroke-width="1.5"/>
    <text x="856" y="739" class="ink">Reds</text>
    <text x="1104" y="739" text-anchor="end" fill="#b3261e">✗ 0</text>
    <rect x="842" y="756" width="274" height="32" rx="6" class="card" stroke-width="1.5"/>
    <text x="856" y="777" class="ink">Bill</text>
    <text x="1104" y="777" text-anchor="end" fill="#1d6b3a">✓ +1</text>
  </g>

  <!-- running scores -->
  <text x="826" y="838" class="d ink" font-size="15" font-weight="800">Running scores</text>
  <g class="d ink" font-size="12" font-weight="700">
    <text x="826" y="862">Owls</text>
    <rect x="866" y="852" width="196" height="12" rx="3" class="lilac" stroke="#26132a" stroke-width="1.5"/>
    <text x="1072" y="862">14</text>
    <text x="826" y="882">Bill</text>
    <rect x="866" y="872" width="168" height="12" rx="3" class="lilac" stroke="#26132a" stroke-width="1.5"/>
    <text x="1044" y="882">12</text>
    <text x="826" y="902">Reds</text>
    <rect x="866" y="892" width="126" height="12" rx="3" class="lilac" stroke="#26132a" stroke-width="1.5"/>
    <text x="1002" y="902">9</text>
  </g>

  <g class="b ink" font-size="15">
    <text x="640" y="942">• The host builds tonight’s quiz from the round bank.</text>
    <text x="640" y="968">• Each team answers a whole round on one phone.</text>
    <text x="640" y="994">• Answers close, then each one is revealed with ✓ or ✗.</text>
    <text x="640" y="1020">• One point per right answer. A tie for first? Tiebreaker.</text>
  </g>

  <!-- footer -->
  <text x="600" y="1088" text-anchor="middle" class="b muted" font-size="15">No app to install: a browser on the big screen and one phone per team.</text>
</svg>

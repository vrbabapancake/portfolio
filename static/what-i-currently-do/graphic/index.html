<script>
  // Match the site's light/dark theme. Embedded: follow the parent page's
  // html.dark class live. Standalone: saved choice, else the OS setting.
  (function(){
    var root = document.documentElement;
    function apply(dark){ root.classList.toggle('dark', !!dark); }
    var parentBody = null;
    try { if (window.parent !== window) parentBody = window.parent.document.documentElement; } catch (e) {}
    if (parentBody) {
      var sync = function(){ apply(parentBody.classList.contains('dark')); };
      sync();
      new MutationObserver(sync).observe(parentBody, { attributes: true, attributeFilter: ['class'] });
      return;
    }
    var theme = null;
    try { theme = localStorage.getItem('theme'); } catch (e) {}
    apply(theme === 'dark' || (!theme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches));
  })();
</script>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1600,"height":1200}}'>
class Component extends DCLogic {
renderVals() {
var DETAILS = {
none: { title: 'Click any card to learn more', body: 'Each card opens a short note on that part of the work: what comes in, what I ship, and the tools that make a team of one possible.' },
pms: { title: 'PMs & Engineering', body: 'I partner with product managers and engineering teams to document PagerDuty’s major releases.' },
jira: { title: 'Jira Requests', body: 'Documentation requests arrive as Jira tickets. My AI pipeline turns each one into a review-ready draft.' },
query: { title: 'AI Query Data', body: 'I use AI query data to find content gaps, prioritizing what users actually ask over what they search for.' },
mark: { title: 'Mark Philp, team of one', body: 'I’m the sole owner of PagerDuty’s customer-facing documentation and e-learning. That work used to belong to a six-person team: three KB writers and three e-learning developers.', href: '../../', linkText: 'See my portfolio' },
docs: { title: 'docs.pagerduty.com', body: 'I own PagerDuty’s customer docs, and helped migrate the platform from ReadMe.io to a GitHub-based Next.js site, improving performance and AI discoverability.', href: 'https://docs.pagerduty.com', linkText: 'Visit docs.pagerduty.com' },
pdu: { title: 'PagerDuty University', body: 'I rebuilt the PagerDuty University course workflow around Claude Design, cutting per-course production time from 3–4 weeks to 1–2 days.' },
talks: { title: 'Conference Talks', body: 'I presented on customer education at Gainsight Pulse Europe 2025.' },
pipelines: { title: 'AI Pipelines', body: 'Claude-based pipelines automate drafting, review and maintenance, including turning Jira requests into review-ready drafts.' },
skills: { title: 'Claude Skills & Linters', body: 'I encoded PagerDuty’s house style into reusable Claude skills and linter rules, so content stays consistent at scale.' },
design: { title: 'Claude Design', body: 'Claude Design is at the centre of the rebuilt e-learning workflow that took course production from weeks to days.' },
audits: { title: 'MCP Content Audits', body: 'I’m building a continuous content auditing system on MCP architecture to keep the docs accurate and current.' }
};
var sel = (this.state && this.state.sel) || 'none';
var self = this;
var c = {};
['pms','jira','query','mark','docs','pdu','talks','pipelines','skills','design','audits'].forEach(function (id) {
var on = sel === id;
c[id] = {
pick: function () { self.setState({ sel: on ? 'none' : id }); },
pressed: on ? 'true' : 'false',
border: id === 'mark' ? (on ? '2px solid var(--g-accent)' : '2px solid var(--g-panel-border)') : (on ? '1px solid var(--g-accent)' : '1px solid var(--g-border)'),
shadow: on ? 'inset 4px 0 0 var(--g-accent), var(--g-shadow-on)' : 'var(--g-shadow)'
};
});
var d = DETAILS[sel];
return {
c: c,
detail: { title: d.title, body: d.body, hasLink: !!d.href, href: d.href || '#', linkText: d.linkText || '' }
};
}
}

<script>
// Energy orbs: click an input card and a little ball of energy runs along its line into the
// "Mark Philp" card; click an output or toolkit card and it runs out from Mark to that card
// (he puts out the outputs, and he uses the tools). Click Mark Philp and energy flows in from
// every input, then out to every output and tool.
// Coordinates are in the graphic's own 1600x1200 layout (it is scaled as a whole).
(function () {
  var M = { l: 640, t: 368, r: 960, b: 584, cx: 800, cy: 476 };
  var PATHS = {
    pms:       [[384, 316], [512, 316], [512, 476], [640, 476]],
    jira:      [[384, 476], [640, 476]],
    query:     [[384, 636], [512, 636], [512, 476], [640, 476]],
    // outputs flow away from Mark, so these start at his card
    docs:      [[960, 476], [1088, 476], [1088, 316], [1216, 316]],
    pdu:       [[960, 476], [1216, 476]],
    talks:     [[960, 476], [1088, 476], [1088, 636], [1216, 636]],
    // Mark uses his toolkit, so these flow down from his card too
    pipelines: [[800, 584], [800, 752], [230, 752], [230, 808]],
    skills:    [[800, 584], [800, 752], [610, 752], [610, 808]],
    design:    [[800, 584], [800, 752], [990, 752], [990, 808]],
    audits:    [[800, 584], [800, 752], [1370, 752], [1370, 808]]
  };
  // Cards that energy flows OUT to: [left, top, width, height]
  var OUTPUTS = {
    docs: [1216, 260, 320, 112], pdu: [1216, 420, 320, 112], talks: [1216, 580, 320, 112],
    pipelines: [64, 808, 332, 128], skills: [444, 808, 332, 128], design: [824, 808, 332, 128], audits: [1204, 808, 332, 128]
  };
  var TITLES = {
    'PMs & Engineering': 'pms', 'Jira Requests': 'jira', 'AI Query Data': 'query',
    'docs.pagerduty.com': 'docs', 'PagerDuty University': 'pdu', 'Conference Talks': 'talks',
    'AI Pipelines': 'pipelines', 'Claude Skills & Linters': 'skills', 'Claude Design': 'design',
    'MCP Content Audits': 'audits', 'Mark Philp': 'mark'
  };
  var NS = 'http://www.w3.org/2000/svg';
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var svg = null, layer = null;

  function stage() { return document.querySelector('x-dc div[style*="width: 1600px"]') || document.querySelector('div[style*="width: 1600px"]'); }
  function el(name, attrs, parent) {
    var e = document.createElementNS(NS, name);
    for (var k in attrs) {
      // CSS variables only work as styles, not SVG attributes
      if (/^(fill|stroke|stop-color)$/.test(k) && String(attrs[k]).indexOf('var(') === 0) e.style.setProperty(k, attrs[k]);
      else e.setAttribute(k, attrs[k]);
    }
    if (parent) parent.appendChild(e);
    return e;
  }
  // The overlay lives inside the graphic; if a re-render ever drops it, put the same node back
  function ensure() {
    var host = stage(); if (!host) return null;
    if (!svg) {
      svg = el('svg', { viewBox: '0 0 1600 1200', width: '1600', height: '1200', 'aria-hidden': 'true' });
      svg.style.cssText = 'position:absolute;left:0;top:0;width:1600px;height:1200px;pointer-events:none;overflow:visible;z-index:5';
      var defs = el('defs', {}, svg);
      var f = el('filter', { id: 'orb-glow', x: '-200%', y: '-200%', width: '500%', height: '500%' }, defs);
      el('feGaussianBlur', { stdDeviation: '6' }, f);
      var g = el('radialGradient', { id: 'orb-core' }, defs);
      el('stop', { offset: '0%', 'stop-color': '#ffffff' }, g);
      el('stop', { offset: '45%', 'stop-color': '#f3cdf7' }, g);
      el('stop', { offset: '100%', 'stop-color': 'var(--g-accent)' }, g);
      layer = el('g', {}, svg);
    }
    if (!svg.isConnected) host.appendChild(svg);
    return svg;
  }

  function lengthOf(pts) { var L = 0; for (var i = 1; i < pts.length; i++) L += Math.hypot(pts[i][0] - pts[i-1][0], pts[i][1] - pts[i-1][1]); return L; }
  function pointAt(pts, d) {
    for (var i = 1; i < pts.length; i++) {
      var seg = Math.hypot(pts[i][0] - pts[i-1][0], pts[i][1] - pts[i-1][1]);
      if (d <= seg) { var t = seg ? d / seg : 0; return [pts[i-1][0] + (pts[i][0] - pts[i-1][0]) * t, pts[i-1][1] + (pts[i][1] - pts[i-1][1]) * t]; }
      d -= seg;
    }
    return pts[pts.length - 1].slice();
  }
  var ease = function (t) { return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };

  function burst(x, y) {
    var ring = el('circle', { cx: x, cy: y, r: 4, fill: 'none', stroke: 'var(--g-accent)', 'stroke-width': 3 }, layer);
    var sparks = [];
    for (var i = 0; i < 6; i++) sparks.push(el('line', { stroke: '#f3cdf7', 'stroke-width': 2.5, 'stroke-linecap': 'round' }, layer));
    var t0 = performance.now();
    (function step(now) {
      ensure();
      var t = Math.min(1, (now - t0) / 420);
      ring.setAttribute('r', 4 + 26 * t); ring.setAttribute('opacity', 1 - t);
      sparks.forEach(function (s, i) {
        var a = i / 6 * Math.PI * 2 + .3, r1 = 8 + 16 * t, r2 = r1 + 8 * (1 - t);
        s.setAttribute('x1', x + Math.cos(a) * r1); s.setAttribute('y1', y + Math.sin(a) * r1);
        s.setAttribute('x2', x + Math.cos(a) * r2); s.setAttribute('y2', y + Math.sin(a) * r2);
        s.setAttribute('opacity', 1 - t);
      });
      if (t < 1) requestAnimationFrame(step); else { ring.remove(); sparks.forEach(function (s) { s.remove(); }); }
    })(t0);
  }

  // A pulse around a card when energy arrives (Mark's card, or an output card)
  function pulseRect(x, y, w, h, rx, big) {
    var r = el('rect', { x: x, y: y, width: w, height: h, rx: rx, fill: 'none', stroke: 'var(--g-accent)', 'stroke-width': big ? 4 : 3 }, layer);
    var t0 = performance.now(), grow = big ? 18 : 10;
    (function step(now) {
      ensure();
      var t = Math.min(1, (now - t0) / (big ? 700 : 480)), g = grow * t;
      r.setAttribute('x', x - g); r.setAttribute('y', y - g);
      r.setAttribute('width', w + 2 * g); r.setAttribute('height', h + 2 * g);
      r.setAttribute('rx', rx + g); r.setAttribute('opacity', 1 - t);
      if (t < 1) requestAnimationFrame(step); else r.remove();
    })(t0);
  }
  function pulseMark(big) { pulseRect(M.l, M.t, M.r - M.l, M.b - M.t, 28, big); }
  function pulseOutput(id) { var o = OUTPUTS[id]; pulseRect(o[0], o[1], o[2], o[3], 22, false); }

  function orb(pts, delay, onArrive) {
    var L = lengthOf(pts), dur = Math.max(650, L / 0.75);
    var g = el('g', { opacity: 0 }, layer), TRAIL = 10;
    // A continuous streak behind the orb: a wide soft line under a thin bright one
    var tailSoft = el('polyline', { fill: 'none', stroke: 'var(--g-accent)', 'stroke-width': 8, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', opacity: .28 }, g);
    var tailCore = el('polyline', { fill: 'none', stroke: '#f3cdf7', 'stroke-width': 2.5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', opacity: .9 }, g);
    var halo = el('circle', { r: 15, fill: 'var(--g-accent)', opacity: .55, filter: 'url(#orb-glow)' }, g);
    var core = el('circle', { r: 7, fill: 'url(#orb-core)' }, g);
    var spark = el('circle', { r: 2.6, fill: '#ffffff' }, g);
    var hist = [], t0 = null;
    function step(now) {
      ensure();
      if (t0 === null) t0 = now + delay;
      var t = (now - t0) / dur;
      if (t < 0) return requestAnimationFrame(step);
      t = Math.min(1, t);
      var p = pointAt(pts, ease(t) * L);
      hist.unshift(p); hist.length = Math.min(hist.length, TRAIL + 1);
      g.setAttribute('opacity', Math.min(1, t * 8));
      var flicker = 1 + Math.sin(now / 38) * 0.12 + (Math.random() - .5) * 0.18;
      halo.setAttribute('cx', p[0]); halo.setAttribute('cy', p[1]); halo.setAttribute('r', 15 * flicker);
      core.setAttribute('cx', p[0]); core.setAttribute('cy', p[1]); core.setAttribute('r', 7 * (0.92 + 0.12 * flicker));
      spark.setAttribute('cx', p[0] + (Math.random() - .5) * 3); spark.setAttribute('cy', p[1] + (Math.random() - .5) * 3);
      var line = hist.map(function (q) { return q[0].toFixed(1) + ',' + q[1].toFixed(1); }).join(' ');
      tailSoft.setAttribute('points', line); tailCore.setAttribute('points', line);
      if (t < 1) requestAnimationFrame(step);
      else { g.remove(); burst(p[0], p[1]); if (onArrive) onArrive(); }
    }
    requestAnimationFrame(step);
  }

  function fire(id) {
    if (!ensure()) return;
    if (reduce) { if (OUTPUTS[id]) pulseOutput(id); else pulseMark(id === 'mark'); return; }
    if (id === 'mark') {
      // The inputs flow in, Mark lights up, then energy flows out to every output and tool
      var ins = Object.keys(PATHS).filter(function (k) { return !OUTPUTS[k]; }), left = ins.length;
      ins.forEach(function (k, i) {
        orb(PATHS[k], i * 60, function () {
          if (--left) return;
          pulseMark(true);
          Object.keys(OUTPUTS).forEach(function (o, j) { orb(PATHS[o], 250 + j * 90, function () { pulseOutput(o); }); });
        });
      });
    } else if (OUTPUTS[id]) {
      pulseMark(false);
      orb(PATHS[id], 120, function () { pulseOutput(id); });
    } else if (PATHS[id]) {
      orb(PATHS[id], 0, function () { pulseMark(false); });
    }
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('button');
    if (!b) return;
    var title = b.querySelector('b');
    var id = title && TITLES[title.textContent.trim()];
    if (id) requestAnimationFrame(function () { fire(id); });
  }, true);
})();
</script>
